<nav class="navbar">
  <div class="navbar-logo">KoguiDex</div>
  <div class="navbar-links">
    <a routerLink="/list" routerLinkActive="active">Pokémons</a>
    <a routerLink="/favorites" routerLinkActive="active">Favoritos</a>
    <a routerLink="/team" routerLinkActive="active">Equipe de Batalha</a>
  </div>
</nav>

<div class="container">
  <h1 class="titulo">Minha equipe de Batalha</h1>

  <div *ngIf="equipe.length === 0" class="empty-team">
    Sua equipe está vazia. Adicione pokémons à sua equipe!
  </div>

  <div class="cards" *ngIf="equipe.length > 0">
    <div *ngFor="let p of equipe" class="card">
      <img [src]="p.imagem" [alt]="p.nome" class="pokemon-img" />
      <h2 class="pokemon-nome">{{ p.nome | titlecase }}</h2>
      <p class="pokemon-tipo">
        Tipo: {{ p.tipo.length ? p.tipo.join(', ') : 'Desconhecido' }}
      </p>

      <div class="actions">
        <button class="btn-favorito">⭐ Favoritar</button>
        <button class="btn-equipe" (click)="removerEquipe(p.id)">❌ Remover da equipe</button>
      </div>
    </div>
  </div>
</div>
