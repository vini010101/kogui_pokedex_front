<div class="container" *ngIf="pokemon; else carregando">
  <div class="card detalhe-card">
    <img [src]="pokemon.imagem || 'assets/default-pokemon.png'" [alt]="pokemon.nome" class="pokemon-img" />
    <h2>{{ pokemon.nome | titlecase }}</h2>
    <p><strong>Código:</strong> {{ pokemon.codigo }}</p>
    <p><strong>Tipo:</strong> {{ pokemon.tipo || 'Não informado' }}</p>
    <p><strong>Favorito:</strong> {{ pokemon.Favorito ? 'Sim' : 'Não' }}</p>
    <p><strong>Na Equipe de Batalha:</strong> {{ pokemon.GrupoBatalha ? 'Sim' : 'Não' }}</p>

    <button class="btn-voltar" (click)="voltar()">⬅ Voltar</button>
  </div>
</div>

<ng-template #carregando>
  <div class="loading">
    {{ mensagem || 'Carregando Pokémon...' }}
  </div>
</ng-template>
