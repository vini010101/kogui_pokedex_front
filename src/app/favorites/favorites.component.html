<nav class="navbar">
  <div class="navbar-logo">KoguiDex</div>
  <div class="navbar-links">
    <a routerLink="/list" routerLinkActive="active">Pokémons</a>
    <a routerLink="/favorites" routerLinkActive="active">Favoritos</a>
    <a routerLink="/team" routerLinkActive="active">Equipe de Batalha</a>
  </div>
</nav>

<div class="container">
  <h1 class="titulo">Meus Pokémon Favoritos</h1>

  <!-- Lista vazia -->
  <div *ngIf="favoritos.length === 0" class="empty-team">
    Sua lista de favoritos está vazia. Adicione pokémons aos seus favoritos!
  </div>

  <!-- Lista de favoritos -->
  <div class="cards" *ngIf="favoritos.length > 0">
    <div *ngFor="let p of favoritos" class="card">
      <img [src]="p.imagem" [alt]="p.nome" class="pokemon-img" />
      <h2 class="pokemon-nome">{{ p.nome | titlecase }}</h2>
      <p class="pokemon-tipo">
        Tipo: {{ p.tipo.length ? p.tipo.join(', ') : 'Desconhecido' }}
      </p>

      <div class="actions">
        <!-- Toggle favorito -->
        <button class="btn-favorito" (click)="toggleFavorito(p.id)">
          {{ p.Favorito ? '⭐ Remover Favorito' : '☆ Favoritar' }}
        </button>
      </div>
    </div>
  </div>
</div>
