<div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <label for="username">Usuário:</label>
    <input type="text" id="username" required [(ngModel)]="username" name="username">

    <label for="password">Senha:</label>
    <input type="password" id="password" required [(ngModel)]="password" name="password">

    <button type="submit" [disabled]="!loginForm.form.valid">Entrar</button>
  </form>

  <!-- Botão para ir para o registro -->
 <button type="button" routerLink="/register" class="register-btn">
  Registrar novo usuário
</button>
</div>
